[package]
name = "nmea_codec"
version = "0.1.0"
edition = "2024"
description = "A codec for NMEA 0183/IEC 61162-1 messages"
license = "Apache-2.0"
keywords = ["nmea", "iso61162", "ais"]
categories = ["parser-implementations"]
repository = "https://github.com/aeolionics-rs/nmea_codec.git"

[features]
ais = ["dep:ais_types", "dep:ais_asm", "dep:ais_message"]

[dependencies]
ais_types = { version="0.2.0", path = "../ais_rs/ais_types", optional = true }
ais_asm = { version="0.2.0", path = "../ais_rs/ais_asm", optional = true }
ais_message = { version="0.2.0", path = "../ais_rs/ais_message", optional = true }

tokio-util = { version = "0.7.18", features = ["codec"] }
futures = "0.3.32"
chrono = "0.4.45"
uom = "0.38.0"
bytes = "1.12.1"
show-option = "0.2.0"
lazy_format = "2.0.3"
bitvec = "1"
deku = "0.20.3"
tracing = "0.1.44"

[dev-dependencies]
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
rcgen = "0.14.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-serial = "5.5.0"
tokio-util = { version = "0.7.18", features = ["codec", "io"] }
tracing-subscriber = "0.3.23"

[[example]]
name = "serial"
required-features = ["ais"]

[[example]]
name = "send_ais"
required-features = ["ais"]

[[example]]
name = "send_area_notice"
required-features = ["ais"]

[[example]]
name = "https_server"
required-features = ["ais"]
